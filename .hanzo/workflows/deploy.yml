name: deploy
on:
  push:
    branches: [main]

# Builds the image and stops there. CI's job ends at "the tag exists and
# resolves"; which tag RUNS is a reviewed pin in hanzoai/universe.
#
# What was here before could never have produced an image. It called
# `buildctl-daemonless.sh`, then `kubectl patch app`, and forge jobs run in
# catthehacker/ubuntu:act-24.04 which ships NEITHER — both are exit 127. It also
# read `secrets.GIT_CLONE_TOKEN`, which exists on neither this repo nor the
# hanzoai org, so even the secret was empty. The observed failure was:
#
#   /var/run/act/workflow/1: line 3: buildctl-daemonless.sh: command not found
#
# The kubectl step is dropped rather than fixed: cd.hanzo.ai's selfHeal restores
# the App CR from the universe pin on its next poll, so a CI-side patch is
# reverted within minutes even where kubectl exists.
jobs:
  build:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # The lab runs amd64 (evo) and arm64 (spark), so the image has to carry
      # both or it deploys on half the fleet. This Dockerfile's builder stage is
      # a plain `FROM golang:...-alpine` — it is not pinned to $BUILDPLATFORM and
      # does not read TARGETARCH — so the arm64 leg compiles under emulation on
      # this amd64 pool. binfmt is what lets that leg run at all.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with: { driver: docker-container, driver-opts: network=host }

      # Without this the push is unauthenticated and 403s at the registry.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # No build secret: idv has no private dependencies — the only hanzoai path
      # in go.mod is its own module declaration — and the Dockerfile is a
      # self-contained multi-stage build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/hanzoai/idv:${{ steps.meta.outputs.tag }}

      # build-push-action can exit 0 before the manifest resolves, so a green run
      # could still mean a future ImagePullBackOff. Prove it pulls.
      - name: Verify the pushed image resolves
        run: |
          set -euo pipefail
          img="ghcr.io/hanzoai/idv:${{ steps.meta.outputs.tag }}"
          for i in 1 2 3 4 5 6; do
            docker buildx imagetools inspect "$img" >/dev/null 2>&1 && { echo "resolved $img"; exit 0; }
            sleep 5
          done
          echo "::error::pushed image never resolved: $img"; exit 1
