name: Docker
# The native deploy pipeline is .hanzo/workflows/deploy.yml (Hanzo Git push →
# act_runner in-cluster → BuildKit builds Dockerfile → ghcr.io/hanzoai/idv:<sha>
# → operator reconcile → hanzocd). GitHub is a mirror; this workflow no longer
# builds or pushes the app image.
on:
  workflow_dispatch:
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: echo "native pipeline is .hanzo/workflows/deploy.yml; GitHub is a mirror"
