name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hanzoai/idv

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: [self-hosted, linux, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - run: go build ./...
      - run: go test ./...

  docker:
    needs: test
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/idv
      platforms: "linux/amd64"
    secrets: inherit
